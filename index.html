<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ghid Tenerife</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenerife">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --hbar:58px;
}
:root,[data-theme="light"]{
  --ink:#10222B; --ink2:#3A4F59; --ink3:#6C8089;
  --paper:#EDF3F5; --surf:#FFFFFF; --surf2:#DFEAEE;
  --line:#CDDDE2; --line2:#B2C7CE;
  --a1:#14607A; --a1bg:#DCEDF3;
  --a2:#1F7F73; --a2bg:#DCF0EC;
  --a3:#8A6218; --a3bg:#F5EBD6;
  --a4:#8C3B3B; --a4bg:#F6E0E0;
  --sea:#3E7A8C; --land:#DCE6E4; --landln:#A9C0C4;
  --sh:0 1px 2px rgba(16,34,43,.05);
}
[data-theme="dark"]{
  --ink:#E6EFF2; --ink2:#A8BCC4; --ink3:#7E9099;
  --paper:#0B171C; --surf:#142229; --surf2:#1C2E36;
  --line:#2A404A; --line2:#3B5764;
  --a1:#63B6D4; --a1bg:#0F2C38;
  --a2:#5FBCAC; --a2bg:#0E2F2B;
  --a3:#D9AC5A; --a3bg:#332710;
  --a4:#D97E7E; --a4bg:#361B1B;
  --sea:#153039; --land:#1E333B; --landln:#3E5A64;
  --sh:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E6EFF2; --ink2:#A8BCC4; --ink3:#7E9099;
  --paper:#0B171C; --surf:#142229; --surf2:#1C2E36;
  --line:#2A404A; --line2:#3B5764;
  --a1:#63B6D4; --a1bg:#0F2C38;
  --a2:#5FBCAC; --a2bg:#0E2F2B;
  --a3:#D9AC5A; --a3bg:#332710;
  --a4:#D97E7E; --a4bg:#361B1B;
  --sea:#153039; --land:#1E333B; --landln:#3E5A64;
  --sh:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.75;
  padding-bottom:calc(84px + var(--sab));-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Inter",sans-serif;font-weight:800;
  letter-spacing:-.02em;line-height:1.16;margin:0;color:var(--ink)}
h1{font-size:1.5em}h2{font-size:1.16em}h3{font-size:1.02em;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--a1);text-underline-offset:3px}
button{font-family:inherit;font-size:inherit;color:var(--ink);border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--a1);outline-offset:2px;border-radius:6px}
.wrap{max-width:580px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);padding-top:var(--sat)}
.hbar{display:flex;align-items:center;gap:9px;height:var(--hbar)}
.hbar .ttl{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;
  letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .sub{font-size:12px;color:var(--ink3);font-weight:400;font-family:"Inter",sans-serif;
  letter-spacing:0;margin-left:8px}
.ibtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surf);flex:none}
.ibtn svg{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.shead{display:flex;align-items:baseline;gap:10px;margin:30px 0 13px}
.shead h2{flex:none}.shead .rule{flex:1;height:1px;background:var(--line)}
.shead .cnt{font-size:.68em;color:var(--ink3);flex:none}

/* zile */
.days{display:flex;flex-direction:column;gap:13px}
.dayb{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;
  text-align:left;width:100%;box-shadow:var(--sh);display:block}
.dayb.has{border-color:var(--a2);border-width:1.5px}
.dayb .dh{display:flex;align-items:baseline;gap:9px}
.dayb .dn{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.05em;flex:1}
.dayb .dt{font-size:.72em;color:var(--ink3)}
.dayb .dl{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.dayb .di{font-size:.83em;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.dayb .di .bl{width:6px;height:6px;border-radius:50%;background:var(--a2);flex:none;transform:translateY(-2px)}
.dayb .de{margin-top:8px;font-size:.83em;color:var(--ink3)}
.dateinp{width:100%;margin-top:13px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--surf);color:var(--ink);font-family:inherit;font-size:.85em}

/* carduri */
.cards{display:flex;flex-direction:column;gap:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  position:relative;box-shadow:var(--sh)}
.card.done{opacity:.5}
.card .hit{display:block;width:100%;text-align:left}
.bn{height:84px;display:block;width:100%;object-fit:cover}
.card .cb{padding:18px}
.card .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.02em;
  line-height:1.25;display:block;padding-right:34px}
.card .bl2{font-size:.83em;color:var(--ink2);margin-top:7px;line-height:1.5;display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:.68em;padding:4px 10px;border-radius:100px;background:var(--surf2);
  color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.car{background:var(--a3bg);color:var(--a3);border-color:transparent}
.tag.nocar{background:var(--a2bg);color:var(--a2);border-color:transparent}
.tag.idl{background:var(--a1bg);color:var(--a1);border-color:transparent;font-weight:600}
.donechk{position:absolute;top:94px;right:13px;width:32px;height:32px;border-radius:10px;
  border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;z-index:2}
.donechk svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.card.done .donechk{background:var(--a2);border-color:var(--a2)}
.card.done .donechk svg{stroke:var(--paper)}

/* buton adauga/scoate din zi */
.addb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;
  border-radius:12px;background:var(--a1bg);color:var(--a1);font-weight:600;font-size:.85em;
  border:1px solid transparent;margin-top:13px}
.addb.on{background:var(--a2bg);color:var(--a2)}
.addb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.cat{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;
  text-align:left;display:flex;flex-direction:column;gap:12px;min-height:128px;box-shadow:var(--sh)}
.cat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.cat .ic svg{width:22px;height:22px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat .nm{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.88em;line-height:1.25}
.cat .ct{display:block;font-size:.7em;color:var(--ink3);margin-top:4px}
.ic-nature{background:var(--a2bg)}.ic-nature svg{stroke:var(--a2)}
.ic-beach{background:var(--a1bg)}.ic-beach svg{stroke:var(--a1)}
.ic-town{background:var(--a3bg)}.ic-town svg{stroke:var(--a3)}
.ic-sea{background:var(--a1bg)}.ic-sea svg{stroke:var(--a1)}
.ic-lava{background:var(--a4bg)}.ic-lava svg{stroke:var(--a4)}
.ic-prac{background:var(--surf2)}.ic-prac svg{stroke:var(--ink2)}

.rows{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .em{font-size:1.05em;flex:none;width:24px;text-align:center}
.row .tx{flex:1;min-width:0}
.row .tx .t{font-weight:500;font-size:.88em}
.row .tx .d{font-size:.72em;color:var(--ink3);line-height:1.4;margin-top:2px}
.row .ch{width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);
  transform:rotate(-45deg);flex:none;margin-right:3px}

.hero{padding:16px 0 4px}
.hero h1{margin-bottom:11px}
.hero .lede{font-size:.9em;color:var(--ink2);line-height:1.65}
.herobn{width:100%;height:150px;border-radius:16px;overflow:hidden;margin:6px 0 15px;border:1px solid var(--line)}
.herobn{position:relative}
.herobn img,.herobn svg{width:100%;height:100%;object-fit:cover;display:block}
.photobtn{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:7px;
  padding:9px 13px;border-radius:100px;background:rgba(0,0,0,.55);color:#fff;
  font-size:12.5px;font-weight:600;backdrop-filter:blur(6px);border:0}
.photobtn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sec{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px;
  margin-bottom:13px;box-shadow:var(--sh)}
.sec>h3{margin-bottom:12px}
.sec p:last-child,.sec ul:last-child{margin-bottom:0}
.sec ul{margin:0 0 .7em;padding-left:20px}
.sec li{margin-bottom:7px;font-size:.9em;line-height:1.6}
.sec li:last-child{margin-bottom:0}
.sec b{font-weight:600}

.tl{list-style:none;margin:0;padding:0}
.tl>li{display:flex;gap:13px;padding:0 0 19px;position:relative}
.tl>li:last-child{padding-bottom:0}
.tl>li::before{content:"";position:absolute;left:6px;top:19px;bottom:-2px;width:1.5px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--a2);background:var(--surf);
  flex:none;margin-top:5px;z-index:1}
.tl .bd{flex:1;min-width:0}
.tl .hr{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.75em;color:var(--a2)}
.tl .ti{font-weight:600;font-size:.92em;margin:2px 0 4px}
.tl .tt{font-size:.85em;color:var(--ink2);line-height:1.6}
.tl .tt ul{margin:6px 0 0;padding-left:19px}
.tl .tt li{margin-bottom:5px;font-size:1em;display:list-item;padding:0;position:static;color:var(--ink2)}

.fld{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:.88em;line-height:1.5}
.fld:focus{border-color:var(--a1);outline:none}
.fld.ta{resize:vertical;min-height:64px}
.hint{font-size:.72em;color:var(--ink3);margin-top:9px;line-height:1.5}
.hint code{background:var(--surf2);padding:2px 6px;border-radius:5px;font-size:.95em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:.78em;padding:9px 14px;border-radius:100px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink2);font-weight:500}
.chip.on{background:var(--a1);border-color:var(--a1);color:var(--paper);font-weight:600}
.gt{border-bottom:1.5px dotted var(--a1);color:var(--a1);cursor:pointer;font-weight:500}
.sheet{position:fixed;inset:0;z-index:90;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;background:var(--surf);
  border-radius:20px 20px 0 0;padding:22px 20px calc(26px + var(--sab));
  max-height:72vh;overflow-y:auto;border-top:1px solid var(--line);
  max-width:580px;margin:0 auto}
.sheet .gr{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
.sheet h3{margin-bottom:10px}
.sheet .gd{font-size:.86em;color:var(--ink2);line-height:1.65}
.note{border-radius:12px;padding:14px 16px;font-size:.85em;line-height:1.6;margin:12px 0}
.note:last-child{margin-bottom:0}
.note.tip{background:var(--a2bg)}.note.warn{background:var(--a4bg)}
.note b{font-weight:600}.note.tip b{color:var(--a2)}.note.warn b{color:var(--a4)}

.combo{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left}
.combo:last-child{border-bottom:0;padding-bottom:0}
.combo .pl{width:8px;height:8px;border-radius:50%;background:var(--a3);flex:none;margin-top:9px}
.combo .ct2{flex:1;font-size:.85em;color:var(--ink2);line-height:1.55}
.combo b{color:var(--ink);font-weight:600}
.combo .ch{width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);
  transform:rotate(-45deg);flex:none;margin-top:10px}

.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.82em}
.tbl th{text-align:left;font-weight:600;font-size:.85em;color:var(--ink3);padding:8px 14px 8px 3px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px 11px 3px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl tr:last-child td{border-bottom:0}

.ck{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left}
.ck:last-child{border-bottom:0}
.ck .bx{width:23px;height:23px;border-radius:7px;border:1.8px solid var(--line2);background:var(--surf2);
  flex:none;margin-top:2px;display:grid;place-items:center}
.ck .bx svg{width:13px;height:13px;stroke:var(--paper);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck[aria-pressed="true"] .bx{background:var(--a2);border-color:var(--a2)}
.ck[aria-pressed="true"] .bx svg{opacity:1}
.ck[aria-pressed="true"] .lb{color:var(--ink3);text-decoration:line-through}
.ck .lb{font-size:.85em;line-height:1.55;flex:1}
.prog{font-size:.72em;color:var(--ink3);margin-bottom:11px}

.mapbox{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--sh)}
.mapbox .vp{overflow:hidden;border-radius:10px;touch-action:none}
.mapbox svg{width:100%;height:auto;display:block;transform-origin:0 0}
.zoomrow{display:flex;gap:8px;margin-top:11px;align-items:center}
.zoomrow button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
  background:var(--surf2);color:var(--ink2);font-size:.8em;font-weight:600}
.zoomrow .lvl{flex:none;min-width:44px;text-align:center;font-size:.72em;color:var(--ink3)}
circle.h{fill:var(--a2);stroke:var(--paper);stroke-width:2.5}
circle.h.sel{fill:var(--a4)}
.pin text{font-family:"Inter",sans-serif;font-size:7.5px;font-weight:600;fill:var(--ink);
  paint-order:stroke;stroke:var(--paper);stroke-width:2.8;stroke-linejoin:round}
.maplg{font-size:.72em;color:var(--ink3);margin-top:11px;text-align:center}
.maplink{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;
  border-radius:12px;background:var(--a1bg);color:var(--a1);font-weight:600;font-size:.85em;
  text-decoration:none;border:1px solid transparent}
.maplink svg{width:18px;height:18px;stroke:var(--a1);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.lk{display:flex;align-items:center;gap:12px;padding:15px 18px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.lk:last-child{border-bottom:0}
.lk .em{font-size:1em;width:24px;text-align:center;flex:none}
.lk .tx{flex:1;min-width:0}
.lk .t{font-weight:500;font-size:.88em}
.lk .d{font-size:.72em;color:var(--ink3);margin-top:2px;line-height:1.4}
.lk .ext{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.srch{position:relative;margin:16px 0 4px}
.srch input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surf);
  padding:0 15px 0 44px;font-size:.9em;font-family:inherit;color:var(--ink)}
.srch input::placeholder{color:var(--ink3)}
.srch svg{position:absolute;left:15px;top:15px;width:19px;height:19px;stroke:var(--ink3);fill:none;stroke-width:1.9;stroke-linecap:round}
.hit2{padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;display:block}
.hit2 .w{font-size:.68em;color:var(--ink3);margin-bottom:3px}
.hit2 .h{font-weight:500;font-size:.88em}
.hit2 .s{font-size:.78em;color:var(--ink2);margin-top:3px;line-height:1.5}
.hit2 mark{background:var(--a3bg);color:var(--a3);padding:0 2px;border-radius:3px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);
  border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabsin{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab svg{width:22px;height:22px;stroke:var(--ink3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab .lb{font-size:10px;color:var(--ink3);font-weight:500}
.tab[aria-selected="true"] svg{stroke:var(--a1)}
.tab[aria-selected="true"] .lb{color:var(--a1);font-weight:600}

.backbar{position:sticky;top:calc(var(--hbar) + var(--sat));z-index:35;background:var(--paper);margin:0 -16px;padding:0 16px;
  border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:7px;font-size:.82em;color:var(--ink2);
  padding:13px 12px 13px 0;font-weight:500}
.back .ar{width:8px;height:8px;border-left:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg)}
.empty{text-align:center;padding:46px 20px;color:var(--ink3);font-size:.85em;line-height:1.7}
.foot{text-align:center;padding:28px 0 10px;font-size:.72em;color:var(--ink3);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="ttl" id="hTitle">Tenerife<span class="sub" id="hSub"></span></div>
    <button class="ibtn" id="btnTheme" aria-label="Schimbă tema"><svg id="themeIcon" viewBox="0 0 24 24"></svg></button>
    <button class="ibtn" id="btnSearch" aria-label="Caută">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </div>
</header>

<main id="app" class="wrap"></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="bg" data-closesheet></div>
  <div class="pan"><div class="gr"></div>
    <h3 id="shT"></h3><div class="gd" id="shD"></div></div>
</div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>

  /* Glosar. Termenii se marchează automat în text și se pot apăsa. */
  glossary: [
    { t:"guachinche", d:"Tavernă rurală canariană. Originar, o casă de țară unde producătorul își vindea vinul propriu, cu mâncare simplă de casă alături. Meniu scurt, uneori doar spus verbal, prețuri mici, adesea numai cash. Sunt instituția gastronomică a nordului Tenerifei." },
    { t:"mojo", d:"Sosul canarian de bază, servit la aproape orice. <b>Mojo rojo</b> e roșu și picant, făcut cu ardei uscat, usturoi și chimen. <b>Mojo verde</b> e mai blând, cu coriandru sau pătrunjel, și merge mai ales la pește." },
    { t:"gofio", d:"Făină din cereale prăjite (grâu, porumb sau orz), ingredient de bază încă din perioada pre-hispanică. Se pune în ciorbe, în deserturi, în lapte, sau se folosește ca înveliș la brânză prăjită." },
    { t:"papas arrugadas", d:"Cartofi mici fierți în apă foarte sărată până li se zbârcește coaja, care rămâne acoperită cu un strat fin de sare. Se mănâncă cu coajă cu tot, cu mojo. Felul cel mai tipic canarian." },
    { t:"barraquito", d:"Cafeaua emblematică a insulei, servită în pahar, cu straturi vizibile: lapte condensat, licor 43, espresso, lapte spumat, coajă de lămâie și scorțișoară. Cerut „completo\" vine cu alcool; „sin alcohol\" fără." },
    { t:"quesillo", d:"Flanul canarian — cremă de ou caramelizată, mai densă și mai cremoasă decât varianta spaniolă continentală. Desertul standard de după masă." },
    { t:"flan", d:"Cremă de ou coaptă, cu sos de caramel deasupra. În Canare se numește de obicei <b>quesillo</b> și e mai densă decât în restul Spaniei." },
    { t:"ron miel", d:"Rom cu miere, băut ca digestiv după masă. Dulce, cu tărie moderată, produs local. Se găsește peste tot și e un suvenir bun." },
    { t:"bienmesabe", d:"Cremă densă de migdale măcinate, ou, zahăr și lămâie. Se mănâncă singură sau peste înghețată. Numele înseamnă literal „bine îmi are gust\"." },
    { t:"tapa", d:"Porție mică de mâncare, servită la bar. <b>Atenție:</b> în Canare tapas nu sunt gratuite cu băutura, ca în Andaluzia — se comandă și se plătesc separat, 3–8 € porția." },
    { t:"ración", d:"Porție mare, gândită pentru împărțit între mai mulți. Dacă ești singur, cere <b>media ración</b> — jumătate de porție." },
    { t:"merienda", d:"Gustarea de după-amiază, între 17:00 și 19:00. Cafea plus ceva dulce. E momentul în care bucătăriile serioase sunt închise, deci nu căuta o masă adevărată atunci." },
    { t:"guagua", d:"Autobuz, în spaniola canariană. Se pronunță „gua-gua\". Localnicii nu spun „autobús\". Dacă întrebi de o stație, cere „la parada de guaguas\"." },
    { t:"calima", d:"Masă de aer cald și praf venită din Sahara. Aduce ceață galbenă, vizibilitate redusă și temperaturi ridicate. Durează de obicei 2–4 zile. Mai frecventă iarna și primăvara." },
    { t:"laurisilva", d:"Pădure de laur — ecosistem subtropical umed care exista în Europa înainte de glaciațiuni și a supraviețuit doar în Canare, Madeira și Azore. Cea din Anaga e printre cele mai bine păstrate." },
    { t:"mirador", d:"Punct de belvedere amenajat, de obicei la marginea drumului, cu parcare și balustradă. Tenerife are zeci, iar cele mai bune sunt marcate în ghid." },
    { t:"barranco", d:"Ravenă sau canion adânc săpat de apă în roca vulcanică. Barranco de Masca e cel mai cunoscut de pe insulă." },
    { t:"caserío", d:"Cătun, grup mic de case izolate. Benijo și Chinamada sunt caseríos — câteva zeci de locuitori, fără magazine." },
    { t:"drago", d:"Dragonier (Dracaena draco), arborele-simbol al Canarelor. Seva lui roșie a fost numită „sângele dragonului\". Cel din Icod are între 800 și 1.000 de ani." },
    { t:"bodega", d:"Cramă sau prăvălie de vinuri. Multe acceptă vizitatori pentru degustări, uneori fără programare." },
    { t:"vieja", d:"Peștele-papagal canarian, cel mai apreciat pește local. Carne albă, fermă. Se servește de obicei întreg, la grătar sau fiert cu papas." },
    { t:"cherne", d:"Pește alb local din familia bibanului de mare, foarte apreciat. Se servește la grătar sau în tocană." },
    { t:"Starlight", d:"Certificare internațională pentru zone cu cer nocturn de calitate excepțională. Parcul Teide o are datorită altitudinii, aerului uscat și poluării luminoase minime." }
  ],

const KEY = "guide:" + GUIDE.destination.toLowerCase().replace(/\s+/g,"-") + ":v5";
const NDAYS = 7;
let state = { days:{}, dates:{}, done:{}, checks:{}, theme:null, photos:{}, custom:[] };
/* Activitățile adăugate de utilizator stau în state.custom și se comportă
   la fel ca cele din ghid peste tot în aplicație. */
const ALL = () => GUIDE.blocks.concat(state.custom||[]);

async function load(){
  try{ if(window.storage && window.storage.get){
    const r = await window.storage.get(KEY);
    if(r && r.value){ Object.assign(state, JSON.parse(r.value)); return; } }}catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) Object.assign(state, JSON.parse(v)); }catch(e){}
}
let st;
function save(){
  clearTimeout(st);
  st = setTimeout(async ()=>{
    const v = JSON.stringify(state);
    try{ if(window.storage && window.storage.set) await window.storage.set(KEY, v); }catch(e){}
    try{ localStorage.setItem(KEY, v); }catch(e){}
  }, 250);
}

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const B = id => ALL().find(b=>b.id===id);
function backLabel(){
  if(!hist.length) return "Înapoi";
  const s=hist[hist.length-1];
  if(s.detail && s.detail.startsWith("block:")){
    const b=B(s.detail.slice(6)); return b ? (b.short||b.name) : "Înapoi"; }
  if(s.detail && s.detail.startsWith("page:")){
    const p=GUIDE.pages.find(x=>x.id===s.detail.slice(5)); return p ? p.name : "Înapoi"; }
  if(s.day!==null && s.day!==undefined) return "Ziua "+(s.day+1);
  if(s.cat){
    if(s.cat==="__prac") return "Informații practice";
    if(s.cat==="__all") return "Toate activitățile";
    if(s.cat.startsWith("p:")){ const c=GUIDE.placeCats.find(x=>x.id===s.cat.slice(2)); return c?c.name:"Înapoi"; }
    const c=GUIDE.cats.find(x=>x.id===s.cat); return c?c.name:"Înapoi"; }
  return {plan:"Zile",explore:"Explorează",map:"Hartă",links:"Linkuri",search:"Caută"}[s.tab]||"Înapoi";
}
const backBar = () => `<div class="backbar"><button class="back" data-back="1">
  <span class="ar"></span>${esc(backLabel())}</button></div>`;
let view = { tab:"plan", detail:null, cat:null, day:null, query:"", mapSel:null };
/* Istoric real de navigare: fiecare pas înainte salvează starea precedentă,
   iar „înapoi" o restaurează. Rezolvă cazul activitate → combinație → înapoi. */
let hist = [];
const snap = () => ({tab:view.tab, detail:view.detail, cat:view.cat, day:view.day,
                     query:view.query, mapSel:view.mapSel, y:window.scrollY});
function go(mut){ hist.push(snap()); mut(); render(); }
function back(){
  if(!hist.length){ view.detail=null; view.cat=null; view.day=null; return render(); }
  const s=hist.pop();
  Object.assign(view,{tab:s.tab,detail:s.detail,cat:s.cat,day:s.day,query:s.query,mapSel:s.mapSel});
  render(); requestAnimationFrame(()=>window.scrollTo(0,s.y||0));
}

/* zilele în care e pusă o activitate */
const dayOf = id => Object.keys(state.days).find(d=>(state.days[d]||[]).includes(id));

function applyTheme(){
  const r = document.documentElement;
  if(state.theme) r.setAttribute("data-theme", state.theme); else r.removeAttribute("data-theme");
  const dark = state.theme==="dark" || (!state.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("themeIcon").innerHTML = dark
    ? '<path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/>'

/* hartă */
const MAPW=340, MAPH=208, PAD=14;
const bnd=(()=>{const la=GUIDE.outline.map(p=>p[0]),ln=GUIDE.outline.map(p=>p[1]);
  return {laMin:Math.min(...la),laMax:Math.max(...la),lnMin:Math.min(...ln),lnMax:Math.max(...ln)};})();
function proj(lat,lng){
  return [Math.round((PAD+(lng-bnd.lnMin)/(bnd.lnMax-bnd.lnMin)*(MAPW-2*PAD))*10)/10,
          Math.round((PAD+(bnd.laMax-lat)/(bnd.laMax-bnd.laMin)*(MAPH-2*PAD))*10)/10];
}
const islandSVG = () => `<polygon points="${GUIDE.outline.map(p=>proj(p[0],p[1]).join(",")).join(" ")}"
  fill="var(--land)" stroke="var(--landln)" stroke-width="1.2" stroke-linejoin="round"/>`;
const gmaps = b => "https://www.google.com/maps/search/?api=1&query=" +

/* Marchează termenii din glosar în text, o singură dată per fragment,
   fără să atingă ce e în interiorul tagurilor HTML. */
const GTERMS = GUIDE.glossary
  .map((g,idx)=>({t:g.t, idx}))
  .sort((a,b)=>b.t.length-a.t.length);
const GRE = GTERMS.map(g=>
  new RegExp("(?<![\\p{L}\\p{M}])("+g.t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\p{L}\\p{M}])","iu"));
/* Marchează termenii din glosar în text. Fiecare termen o singură dată per
   fragment, fără să atingă ce e în interiorul tagurilor HTML. */
function gloss(html){
  if(!html) return html;
  const used=new Set();
  return String(html).split(/(<[^>]+>)/).map(seg=>{
    if(!seg || seg.startsWith("<")) return seg;
    GTERMS.forEach((g,i)=>{
      if(used.has(g.idx) || !GRE[i].test(seg)) return;
      used.add(g.idx);
      seg=seg.replace(GRE[i],`<button class="gt" data-gloss="${g.idx}">$1</button>`);
    });
    return seg;
  }).join("");
}

const notesHTML = ns => !ns ? "" : ns.map(n=>

const tableHTML = t => `<div class="tblw"><table class="tbl"><thead><tr>${
  t.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${

function screenSearch(){
  const q=view.query.trim().toLowerCase();
  let res;
  if(q.length>=2){
    const hits=[];
    const mark=t=>{const pl=String(t).replace(/<[^>]+>/g," ").replace(/\s+/g," ");
      const i=pl.toLowerCase().indexOf(q); if(i<0) return null;
      const s=Math.max(0,i-42), e=Math.min(pl.length,i+q.length+72);
      return (s>0?"…":"")+esc(pl.slice(s,i))+"<mark>"+esc(pl.slice(i,i+q.length))+"</mark>"+
             esc(pl.slice(i+q.length,e))+(e<pl.length?"…":"");};
    ALL().forEach(b=>{const m=mark([b.name,b.blurb,b.lede,
      ...(b.timeline||[]).map(t=>t.ti+" "+t.tx),...(b.notes||[]).map(n=>n.t)].join(" "));
      if(m) hits.push({w:"Activitate",h:b.name,s:m,go:"block:"+b.id});});
    GUIDE.places.forEach(p=>{const m=mark([p.n,p.area,p.addr,p.tip,p.when||""].join(" "));
      if(m){const c=GUIDE.placeCats.find(x=>x.id===p.t);
        hits.push({w:c.name+" · "+p.area,h:p.n,s:m,go:"cat:p:"+p.t});}});
    GUIDE.pages.forEach(p=>p.sections.forEach(s=>{
      const m=mark([s.h,s.body||"",(s.checklist||[]).join(" "),
        s.table?s.table.rows.flat().join(" "):"",(s.notes||[]).map(n=>n.t).join(" ")].join(" "));
      if(m) hits.push({w:p.name,h:s.h,s:m,go:"page:"+p.id});}));
    GUIDE.glossary.forEach(g=>{const m=mark(g.t+" "+g.d);
      if(m) hits.push({w:"Glosar",h:g.t,s:m,go:"page:__glossary"});});
    GUIDE.links.forEach(g=>g.items.forEach(i=>{const m=mark(i.t+" "+i.d);
      if(m) hits.push({w:"Link · "+g.g,h:i.t,s:m,go:"tab:links"});}));
    res = hits.length ? hits.map(h=>`<button class="hit2" data-goto="${h.go}">
      <span class="w">${esc(h.w)}</span><span class="h">${esc(h.h)}</span>
      <span class="s">${h.s}</span></button>`).join("")
      : `<div class="empty">Nimic pentru „${esc(view.query)}”.</div>`;
  } else res = `<div class="empty">Scrie minim 2 litere.<br>Caută prin activități, locuri,<br>note, prețuri și fraze.</div>`;
  return `<div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Caută în tot ghidul…" value="${esc(view.query)}"
      autocomplete="off" autocapitalize="off" spellcheck="false"></div>${res}`;
}

/* Scoate coordonatele dintr-un link de Google Maps sau dintr-un text „lat,lng". */
function parseCoord(s){
  if(!s) return null;
  s=s.trim();
  const pats=[
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,              // .../@28.41,-16.54,15z
    /[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,      // ...?q=28.41,-16.54
    /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,          // ...!3d28.41!4d-16.54
    /^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/        // lipit direct
  ];
  for(const p of pats){
    const m=s.match(p);
    if(m){
      const la=+m[1], ln=+m[2];
      if(la>=-90&&la<=90&&ln>=-180&&ln<=180) return la.toFixed(5)+","+ln.toFixed(5);
    }
  }
  return null;
}

function formRead(){
  const g=i=>{const el=document.getElementById(i); return el?el.value.trim():"";};
  form.name=g("f_name"); form.blurb=g("f_blurb"); form.lede=g("f_lede");

  }
  form.short = form.name.length>18 ? form.name.slice(0,17)+"…" : form.name;
  form.blurb = form.blurb || "Activitate adăugată de tine.";

/* Zoom și deplasare pe hartă: pinch cu două degete, tragere cu unul, plus butoane. */
let mapZ = {s:1, x:0, y:0};
function mapApply(){
  const svg=document.getElementById("mapsvg"); if(!svg) return;
  const vp=document.getElementById("vp");
  const w=vp.clientWidth, h=vp.clientHeight;
  mapZ.s=Math.min(5,Math.max(1,mapZ.s));
  const maxX=w*(mapZ.s-1), maxY=h*(mapZ.s-1);
  mapZ.x=Math.min(0,Math.max(-maxX,mapZ.x));
  mapZ.y=Math.min(0,Math.max(-maxY,mapZ.y));
  svg.style.transform=`translate(${mapZ.x}px,${mapZ.y}px) scale(${mapZ.s})`;
  const l=document.getElementById("zlvl"); if(l) l.textContent=mapZ.s.toFixed(1)+"×";
}
function mapInit(){
  const vp=document.getElementById("vp"); if(!vp) return;
  let pts=new Map(), lastD=0, lastC=null, moved=false;
  const mid=()=>{const a=[...pts.values()];
    return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2};};
  const dist=()=>{const a=[...pts.values()];
    return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);};
  vp.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){lastD=dist();lastC=mid();}
    moved=false; vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1 && mapZ.s>1){
      mapZ.x+=e.clientX-prev.x; mapZ.y+=e.clientY-prev.y;
      moved=true; mapApply(); e.preventDefault();
    } else if(pts.size===2){
      const d=dist(), c=mid(), r=vp.getBoundingClientRect();
      const k=d/(lastD||d);
      const cx=c.x-r.left, cy=c.y-r.top;
      mapZ.x = cx-(cx-mapZ.x)*k + (c.x-lastC.x);
      mapZ.y = cy-(cy-mapZ.y)*k + (c.y-lastC.y);
      mapZ.s*=k; lastD=d; lastC=c; moved=true; mapApply(); e.preventDefault();
    }
  });
  const up=e=>{pts.delete(e.pointerId); if(pts.size<2){lastD=0;lastC=null;}};
  vp.addEventListener("pointerup",up); vp.addEventListener("pointercancel",up);
  vp.addEventListener("click",e=>{ if(moved){e.stopPropagation();e.preventDefault();moved=false;} },true);
  mapApply();
}

function render(keep){
  const y=window.scrollY;
  let html;
  if(view.detail==="new") html=screenEditor(null);
  else if(view.detail && view.detail.startsWith("edit:")) html=screenEditor(view.detail.slice(5));
  else if(view.detail && view.detail.startsWith("block:")) html=screenBlock(view.detail.slice(6));
  else if(view.detail && view.detail.startsWith("page:")) html=screenPage(view.detail.slice(5));
  else if(view.day!==null) html=screenDay(view.day);
  else if(view.cat) html=screenCat(view.cat);
  else html=({plan:screenPlan,explore:screenExplore,map:screenMap,
              links:screenLinks,search:screenSearch}[view.tab])();
  app.innerHTML=html;
  const top = !view.detail && !view.cat && view.day===null;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(top && t.dataset.tab===view.tab)));
  document.getElementById("hSub").textContent = top ? GUIDE.subtitle : "";
  if(document.getElementById("vp")) mapInit();
  const eb=document.getElementById("expBtn"); if(eb) eb.addEventListener("click",exportData);
  const ib=document.getElementById("impBtn");
  if(ib) ib.addEventListener("click",()=>document.getElementById("importIn").click());
  const wb=document.getElementById("wipeBtn");
  if(wb) wb.addEventListener("click",()=>{
    if(!confirm("Ștergi tot ce ai salvat? Planul, bifele, activitățile tale și pozele.")) return;
    if(!confirm("Sigur? Nu se poate anula.")) return;
    state={days:{},dates:{},done:{},checks:{},theme:state.theme,photos:{},custom:[]};
    save(); hist=[]; view.detail=null; render();
  });
  const sv=document.getElementById("saveAct");
  if(sv) sv.addEventListener("click",formSave);
  const dl=document.getElementById("delAct");
  if(dl) dl.addEventListener("click",()=>{
    if(!confirm("Ștergi activitatea „"+form.name+"”?")) return;
    state.custom=(state.custom||[]).filter(x=>x.id!==form.id);
    Object.keys(state.days).forEach(k=>{state.days[k]=state.days[k].filter(x=>x!==form.id);});
    delete state.done[form.id]; if(state.photos) delete state.photos[form.id];
    save(); form=null; hist=[]; view.detail=null; view.cat="__all"; render();
  });
  const ci=document.getElementById("f_coord");
  if(ci) ci.addEventListener("input",()=>{
    const h=document.getElementById("coordHint");
    const c=parseCoord(ci.value);
    h.innerHTML = ci.value.trim()
      ? (c?`✓ Poziție găsită: <code>${c}</code>`:"Nu găsesc coordonate aici. Încearcă linkul complet din Google Maps.")
      : "Deschizi locul în Google Maps → Share → Copy link. Sau scrii direct <code>28.41,-16.54</code>.";
    h.style.color = ci.value.trim()&&!c ? "var(--a4)" : "";
  });
  const dt=document.getElementById("dt");
  if(dt) dt.addEventListener("change",e=>{
    state.dates[+e.target.dataset.dayidx]=e.target.value.trim(); save(); });
  if(view.tab==="search" && top){
    const i=document.getElementById("q");
    i.addEventListener("input",e=>{view.query=e.target.value;render(true);});
    if(document.activeElement!==i && view.query){i.focus();i.setSelectionRange(99,99);}
  }
  window.scrollTo(0, keep?y:0);
}

document.addEventListener("click",e=>{
  if(e.target.closest("a")) return;
  const t=e.target.closest("[data-day],[data-open],[data-done],[data-page],[data-back],[data-goto],[data-check],[data-cat],[data-pin],[data-add],[data-rm],[data-gloss],[data-photo],[data-zoom],[data-closesheet],[data-new],[data-edit],[data-set],[data-addnote],[data-delnote],.tab");
  if(!t) return;
  const d=t.dataset;

  if(d.closesheet!==undefined){ return closeSheet(); }
  if(d.new!==undefined){ formInit(null); return go(()=>{view.detail="new";}); }
  if(d.edit!==undefined){ formInit(d.edit); return go(()=>{view.detail="edit:"+d.edit;}); }
  if(d.set!==undefined){
    formRead();
    if(d.set==="car") form.car = d.val==="1"; else form[d.set]=d.val;
    return render(true);
  }
  if(d.addnote!==undefined){
    formRead();
    const t=prompt(d.addnote==="warn"?"Ce trebuie evitat sau știut?":"Care e pontul?");
    if(t && t.trim()){ form.notes=form.notes||[]; form.notes.push({k:d.addnote,t:t.trim()}); }
    return render(true);
  }
  if(d.delnote!==undefined){ formRead(); form.notes.splice(+d.delnote,1); return render(true); }
  if(d.gloss!==undefined){ return openSheet(+d.gloss); }
  if(d.zoom!==undefined){
    const v=+d.zoom;
    if(v===0){ mapZ={s:1,x:0,y:0}; }
    else {
      const vp=document.getElementById("vp");
      const cx=vp.clientWidth/2, cy=vp.clientHeight/2;
      const k = v>0 ? 1.5 : 1/1.5;
      mapZ.x = cx-(cx-mapZ.x)*k; mapZ.y = cy-(cy-mapZ.y)*k; mapZ.s*=k;
    }
    return mapApply();
  }
  if(d.photo!==undefined){ pendingPhoto=d.photo;
    document.getElementById("photoIn").click(); return; }

  if(d.add!==undefined){
    const to=+d.to, prev=dayOf(d.add);
    if(prev!==undefined) state.days[prev]=state.days[prev].filter(x=>x!==d.add);
    (state.days[to]=state.days[to]||[]).push(d.add);
    save(); return render(true);
  }
  if(d.rm!==undefined){
    const p=dayOf(d.rm);
    if(p!==undefined) state.days[p]=state.days[p].filter(x=>x!==d.rm);
    save(); return render(true);
  }
  if(d.done!==undefined){ state.done[d.done]=!state.done[d.done]; save(); return render(true); }
  if(d.check){ state.checks[d.check]=!state.checks[d.check]; save(); return render(true); }
  if(d.back){ return back(); }

  if(d.pin){ if(view.mapSel===d.pin) return go(()=>{view.detail="block:"+d.pin;});
             view.mapSel=d.pin; return render(true); }
  if(d.day!==undefined) return go(()=>{view.day=+d.day;});
  if(d.cat) return go(()=>{view.cat=d.cat;});
  if(d.open) return go(()=>{view.detail="block:"+d.open;});
  if(d.page) return go(()=>{view.detail="page:"+d.page;});
  if(d.goto) return go(()=>{
    if(d.goto.startsWith("tab:")){view.detail=null;view.cat=null;view.day=null;view.tab=d.goto.slice(4);}
    else if(d.goto.startsWith("cat:")){view.detail=null;view.cat=d.goto.slice(4);}
    else view.detail=d.goto;
  });
  if(t.classList.contains("tab")){
    hist=[]; view.detail=null;view.cat=null;view.day=null;view.tab=d.tab; return render();
  }
});

/* ── export și import: plasa de siguranță pentru datele tale ── */
function exportData(){
  const blob=new Blob([JSON.stringify({v:6,when:new Date().toISOString(),state},null,1)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ghid-"+GUIDE.destination.toLowerCase()+"-"+
    new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("importIn").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  e.target.value="";
  try{
    const d=JSON.parse(await f.text());
    if(!d.state) throw 0;
    const n=(d.state.custom||[]).length;
    if(!confirm("Înlocuiesc tot ce ai acum cu datele din fișier?\n\n"+
      Object.values(d.state.days||{}).flat().length+" activități planificate, "+
      n+" activități proprii, "+
      Object.keys(d.state.photos||{}).length+" poze.")) return;
    state=Object.assign({days:{},dates:{},done:{},checks:{},theme:null,photos:{},custom:[]},d.state);
    save(); applyTheme(); hist=[]; view.detail=null; view.cat=null; view.day=null;
    render(); alert("Gata, datele au fost încărcate.");
  }catch(err){ alert("Fișierul nu pare valid."); }
});

/* ── poze: redimensionate înainte de salvare, ca să nu umple stocarea ── */
let pendingPhoto=null;
document.getElementById("photoIn").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f||!pendingPhoto) return;
  const id=pendingPhoto; pendingPhoto=null; e.target.value="";
  try{
    const url=URL.createObjectURL(f);
    const img=await new Promise((res,rej)=>{const i=new Image();
      i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const MAXW=900;
    const sc=Math.min(1,MAXW/img.naturalWidth);
    const w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    state.photos=state.photos||{};
    state.photos[id]=cv.toDataURL("image/jpeg",0.72);
    save(); render(true);
  }catch(err){ alert("Nu am putut încărca poza. Încearcă alta."); }
});

document.getElementById("btnSearch").addEventListener("click",()=>{
  view.detail=null;view.cat=null;view.day=null;view.tab="search";render();
  setTimeout(()=>{const i=document.getElementById("q");if(i)i.focus();},40);
});
document.getElementById("btnTheme").addEventListener("click",()=>{
  const dark=state.theme==="dark"||(!state.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  state.theme=dark?"light":"dark"; applyTheme(); save(); render(true);
});

/* Înregistrează service worker-ul. Doar pe https sau localhost —
   dacă fișierul e deschis local, aplicația merge la fel, doar fără instalare. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

(async()=>{ await load(); applyTheme();
  document.getElementById("hTitle").childNodes[0].nodeValue=GUIDE.destination;
  render(); })();
</script>
